<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f7f3ea" />
		<!-- the Challenge's own mark (prep/make_turtle.py): black turtle for
		     light browser chrome, white for dark — the same pair the
		     competition site itself ships -->
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-light.png" media="(prefers-color-scheme: light)" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-dark.png" media="(prefers-color-scheme: dark)" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
